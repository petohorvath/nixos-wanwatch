name: audit

# Weekly vulnerability scan promised by PLAN §11.10 and CLAUDE.md
# §Audits. Two independent jobs:
#
#   - govulncheck — scans the built daemon for vulnerable Go symbols
#     and embedded standard-library/module versions (golang.org/x/vuln).
#   - vulnix — scans the daemon's Nix runtime derivations against the
#     vulnerability database (nix-community/vulnix).
#
# A job failure means "something flagged" — the run goes red and
# the failure surfaces in GitHub's notification stream. We
# intentionally do not auto-file issues yet; PLAN §11.10 mentions
# that as a follow-up, but the simpler "fail loudly" shape is
# enough to get attention while we're early-release.

on:
  # Mondays at 06:00 UTC — pick a slot when the GitHub-hosted
  # runner pool is least contended. Manual dispatch lets us re-run
  # on demand without waiting a week.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Scan the release artifact rather than whichever Go compiler is
  # on the source-analysis PATH. Binary mode reads the exact Go and
  # module versions embedded by buildGoModule.
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
      - name: Build daemon
        run: nix build --print-build-logs .#wanwatchd
      - name: govulncheck
        run: |
          nix develop .#audit --command \
            govulncheck -mode=binary result/bin/wanwatchd

  # vulnix scans only the runtime closure's derivations against the
  # NVD/cvelist mirror nix-community maintains. Its default
  # --requisites traversal follows build-time inputs as well, which
  # produces unrelated compiler and toolchain findings.
  vulnix:
    name: vulnix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
      - name: Test fail-closed vulnix retries
        run: bash tests/ci/vulnix-retry.sh
      - name: Build daemon closure
        run: nix build --print-build-logs .#wanwatchd
      - name: vulnix
        run: |
          set -euo pipefail

          # Convert each output in the runtime closure to its deriver,
          # then disable vulnix's own build-requisite traversal.
          nix-store -qR "$(readlink -f result)" |
            while IFS= read -r path; do
              deriver="$(nix-store -q --deriver "$path")"
              if [[ "$deriver" == "unknown-deriver" ]]; then
                echo "No deriver available for runtime path: $path" >&2
                exit 1
              fi
              printf '%s\n' "$deriver"
            done |
            sort -u > runtime-derivers

          test -s runtime-derivers
          nix develop .#audit --command \
            .github/scripts/retry-vulnix.sh runtime-derivers

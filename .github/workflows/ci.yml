name: CI

on:
  push:
    branches: [main]
  # `pull_request` (NOT `pull_request_target`) is intentional. The
  # plain trigger runs fork PRs with a read-only GITHUB_TOKEN and
  # no access to secrets — safe given the workflow runs untrusted
  # Nix evaluation. `pull_request_target` would check out the PR
  # head while running with the *base* repo's token — the classic
  # supply-chain footgun. Do not change without considering token
  # scope and what the workflow runs.
  pull_request:
  workflow_dispatch:

# Default to read-only for all jobs. CI runs untrusted code from
# fork PRs (Nix evaluation, Go builds); a least-privilege
# GITHUB_TOKEN limits blast radius if a flake input or action is
# compromised. Override per-job if a step ever needs to write.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The shared project policy, called from `check.yml`, runs the flake
# checks, including the VM tests, with the locked nixpkgs and the
# policy's stable and unstable pins (ADR-0013). This workflow keeps
# the checks that need the network or run outside the Nix sandbox.
#
# Each job caches /nix/store via nix-community/cache-nix-action so
# subsequent runs don't have to re-fetch every nixpkgs derivation.
# The cache key is `(os, arch, job, flake.lock)` so a lockfile bump
# cleanly retires stale stores; restore-prefix lets a near-miss
# warm-restore from any earlier same-job cache. Purge keeps the GHA
# cache budget (10 GB / repo) under control by dropping older
# same-prefix entries.
jobs:
  # `go mod` hygiene. The daemon's deps are vendored under
  # `daemon/vendor/` and every flake check runs Go with
  # `-mod=vendor`, which checks vendor/ against go.mod but never
  # re-derives go.mod itself — so a stale `// indirect` annotation
  # or an unused `require` passes every other job untouched.
  # `go mod tidy -diff` re-derives go.mod/go.sum and exits
  # non-zero if they would change; `go mod verify` confirms the
  # module cache matches go.sum. This needs network — the pruned
  # module graph is not vendored — so unlike the daemon checks it
  # runs as a plain job, not a hermetic flake check.
  go-mod:
    name: go.mod hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
          purge-created: 0
          purge-primary-key: never
      - name: Verify modules against go.sum
        run: nix develop --command bash -c 'cd daemon && go mod download && go mod verify'
      - name: Verify go.mod and go.sum are tidy
        run: nix develop --command bash -c 'cd daemon && go mod tidy -diff'

  # Runs the review wrapper's contract test on each Linux system the
  # policy tests: `tooling/review-env.sh` runs outside the Nix
  # sandbox, so no flake check covers it.
  review-env:
    name: review environment (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
          purge-created: 0
          purge-primary-key: never
      - name: Verify executable review environment
        run: bash tests/ci/review-env.sh
